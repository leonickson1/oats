name: Oats
options:
  bundleIdPrefix: dev.oats
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "26.0"
packages:
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit.git
    from: "1.0.0"
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio.git
    from: "0.12.4"
  RichTextKit:
    url: https://github.com/danielsaidi/RichTextKit.git
    from: "1.0.0"
targets:
  Oats:
    type: application
    platform: macOS
    sources:
      - path: Oats
    dependencies:
      - package: WhisperKit
      - package: FluidAudio
      - package: RichTextKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.oats.app
        PRODUCT_NAME: Oats
        MARKETING_VERSION: 0.3.0
        CURRENT_PROJECT_VERSION: 4
        INFOPLIST_FILE: Oats/Info.plist
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "838ASYRYR5"
        CODE_SIGN_ENTITLEMENTS: Oats/Oats.entitlements
        ENABLE_HARDENED_RUNTIME: false
        ENABLE_APP_SANDBOX: false
        SWIFT_VERSION: "5.0"
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        ENABLE_USER_SCRIPT_SANDBOXING: false
        ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
